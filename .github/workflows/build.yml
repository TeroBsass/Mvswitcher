name: Build MVSwitcher
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: gradle clean test installDist
      - name: CLI smoke test
        run: |
          build/install/mvswitcher/bin/mvswitcher --help
          build/install/mvswitcher/bin/mvswitcher versions
      - name: Upload CLI distribution
        uses: actions/upload-artifact@v4
        with:
          name: mvswitcher-cli
          path: build/install/mvswitcher/
