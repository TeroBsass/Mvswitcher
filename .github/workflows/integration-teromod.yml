name: Teromod migration integration
on:
  push:
    paths:
      - .github/workflows/integration-teromod.yml
  workflow_dispatch:

jobs:
  migrate-teromod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MVSwitcher CLI
        run: gradle clean test installDist
      - name: Get real NeoForge 26.3 test mod
        run: git clone --depth 1 --branch master https://github.com/TeroBsass/Teromod.git sample/Teromod
      - name: Migrate TeroMod to Minecraft 1.21.11
        run: |
          mkdir -p integration
          build/install/mvswitcher/bin/mvswitcher analyze sample/Teromod
          build/install/mvswitcher/bin/mvswitcher migrate sample/Teromod --from 26.3 --to 1.21.11 --skip-build --output integration/TeroMod-1.21.11
      - name: Try compiling migrated TeroMod
        id: target_build
        continue-on-error: true
        run: |
          cd integration/TeroMod-1.21.11
          chmod +x gradlew
          ./gradlew build --no-daemon 2>&1 | tee ../../integration/target-build.log
      - name: Upload migration and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teromod-migration-diagnostics
          path: |
            integration/TeroMod-1.21.11/src/**
            integration/TeroMod-1.21.11/gradle.properties
            integration/TeroMod-1.21.11/build.gradle
            integration/TeroMod-1.21.11/settings.gradle
            integration/target-build.log
          if-no-files-found: warn
      - name: Fail workflow if migrated mod does not compile
        if: steps.target_build.outcome == 'failure'
        run: |
          echo "The migrated TeroMod did not compile. See the uploaded target-build.log artifact."
          exit 1
